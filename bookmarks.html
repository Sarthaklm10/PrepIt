<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="src/img/favicon.png" type="image/x-icon" />

    <link rel="stylesheet" href="src/sass/main.scss" />
    <script defer type="module" src="src/js/bookmarks-page.js"></script>

    <title>My Bookmarks - PrepIt</title>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <a href="/">
          <img
            src="src/img/logo2.png"
            alt="Logo"
            class="header__logo header__logo-light"
          />
          <img
            src="src/img/logo_dark.png"
            alt="Logo"
            class="header__logo header__logo-dark"
          />
        </a>

        <div class="page-title">
          <h1>My Saved Recipes</h1>
        </div>
        
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="/" class="nav__btn">
                <svg class="nav__icon">
                  <use href="src/img/icons.svg#icon-home"></use>
                </svg>
                <span>Home</span>
              </a>
            </li>
            <li class="nav__item">
              <a href="add-recipe.html" class="nav__btn">
                <svg class="nav__icon">
                  <use href="src/img/icons.svg#icon-plus-circle"></use>
                </svg>
                <span>Create Recipe</span>
              </a>
            </li>
          </ul>
          <button class="nav__btn nav__btn--theme" id="theme-toggle">
            <svg class="nav__icon nav__icon--sun">
              <use href="src/img/icons.svg#icon-sun"></use>
            </svg>
            <svg class="nav__icon nav__icon--moon">
              <use href="src/img/icons.svg#icon-moon"></use>
            </svg>
          </button>
        </nav>
      </header>

      <main class="bookmarks-page">
        <div class="bookmarks-container">
          <div class="bookmarks-grid"></div>
          <div class="empty-state hidden">
            <svg class="empty-icon">
              <use href="src/img/icons.svg#icon-heart"></use>
            </svg>
            <h2>No bookmarks yet</h2>
            <p>Start exploring recipes and save your favorites here!</p>
            <a href="/" class="btn btn--primary">Discover Recipes</a>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
