<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="src/img/favicon.png" type="image/x-icon" />

    <link rel="stylesheet" href="src/sass/main.scss" />
    <script defer type="module" src="src/js/add-recipe-page.js"></script>

    <title>Create Recipe - PrepIt</title>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <a href="/">
          <img
            src="src/img/logo2.png"
            alt="Logo"
            class="header__logo header__logo-light"
          />
          <img
            src="src/img/logo_dark.png"
            alt="Logo"
            class="header__logo header__logo-dark"
          />
        </a>

        <div class="page-title">
          <h1>Create New Recipe</h1>
        </div>
        
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="/" class="nav__btn">
                <svg class="nav__icon">
                  <use href="src/img/icons.svg#icon-home"></use>
                </svg>
                <span>Home</span>
              </a>
            </li>
            <li class="nav__item">
              <a href="bookmarks.html" class="nav__btn">
                <svg class="nav__icon">
                  <use href="src/img/icons.svg#icon-heart"></use>
                </svg>
                <span>My Recipes</span>
              </a>
            </li>
          </ul>
          <button class="nav__btn nav__btn--theme" id="theme-toggle">
            <svg class="nav__icon nav__icon--sun">
              <use href="src/img/icons.svg#icon-sun"></use>
            </svg>
            <svg class="nav__icon nav__icon--moon">
              <use href="src/img/icons.svg#icon-moon"></use>
            </svg>
          </button>
        </nav>
      </header>

      <main class="add-recipe-page">
        <div class="recipe-form-container">
          <form class="recipe-form">
            <div class="form-section">
              <h3>Basic Information</h3>
              <div class="form-row">
                <div class="form-group">
                  <label for="title">Recipe Name</label>
                  <input id="title" name="title" type="text" placeholder="Enter recipe name" required />
                </div>
                <div class="form-group">
                  <label for="publisher">Chef/Publisher</label>
                  <input id="publisher" name="publisher" type="text" placeholder="Your name or source" required />
                </div>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label for="cookingTime">Cooking Time (minutes)</label>
                  <input id="cookingTime" name="cookingTime" type="number" placeholder="30" min="1" required />
                </div>
                <div class="form-group">
                  <label for="servings">Servings</label>
                  <input id="servings" name="servings" type="number" placeholder="4" min="1" required />
                </div>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label for="sourceUrl">Recipe URL (optional)</label>
                  <input id="sourceUrl" name="sourceUrl" type="url" placeholder="https://example.com/recipe" />
                </div>
                <div class="form-group">
                  <label for="image">Image URL</label>
                  <input id="image" name="image" type="url" placeholder="https://example.com/image.jpg" required />
                </div>
              </div>
            </div>

            <div class="form-section">
              <h3>Ingredients</h3>
              <div class="ingredients-container">
                <div class="ingredient-item">
                  <input name="ingredient-1" type="text" placeholder="2,cups,flour" required />
                  <button type="button" class="btn-remove-ingredient" disabled>Remove</button>
                </div>
              </div>
              <button type="button" class="btn btn--secondary add-ingredient-btn">
                <svg>
                  <use href="src/img/icons.svg#icon-plus"></use>
                </svg>
                Add Ingredient
              </button>
              <p class="ingredient-help">Format: quantity,unit,description (e.g., "2,cups,flour")</p>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <svg>
                  <use href="src/img/icons.svg#icon-check"></use>
                </svg>
                Create Recipe
              </button>
              <a href="/" class="btn btn--secondary">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
