<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="src/img/favicon.png" type="image/x-icon" />

    <link rel="stylesheet" href="src/sass/main.scss" />
    <script defer type="module" src="src/js/controller.js"></script>

    <title>PrepIt-Your Ultimate Recipe Search Engine</title>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <a href="/">
          <img
            src="src/img/logo2.png"
            alt="Logo"
            class="header__logo header__logo-light"
          />
          <img
            src="src/img/logo_dark.png"
            alt="Logo"
            class="header__logo header__logo-dark"
          />
        </a>

        <form class="search">
          <input
            type="text"
            class="search__field"
            placeholder="Search for a recipe..."
          />
          <button class="btn search__btn">
            <svg class="search__icon">
              <use href="src/img/icons.svg#icon-search"></use>
            </svg>
            <span>Search</span>
          </button>
        </form>

        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item nav__item--auth">
              <button class="nav__btn nav__btn--login">
                <svg class="nav__icon">
                  <use href="src/img/icons.svg#icon-user"></use>
                </svg>
                <span>Login</span>
              </button>

              <div class="nav__user hidden">
                <button class="nav__btn nav__btn--user">
                  <svg class="nav__icon">
                    <use href="src/img/icons.svg#icon-user"></use>
                  </svg>
                  <span class="nav__user-name">User</span>
                </button>
                <div class="nav__user-menu">
                  <button class="nav__btn nav__btn--logout">Logout</button>
                </div>
              </div>
            </li>

            <li class="nav__item nav__item--filters hidden">
              <div class="diet-filters"></div>
            </li>

            <li class="nav__item">
              <button class="nav__btn nav__btn--add-recipe">
                <svg class="nav__icon">
                  <use href="src/img/icons.svg#icon-edit"></use>
                </svg>
                <span>Add recipe</span>
              </button>
            </li>
            <li class="nav__item">
              <button class="nav__btn nav__btn--bookmarks">
                <svg class="nav__icon">
                  <use href="src/img/icons.svg#icon-bookmark"></use>
                </svg>
                <span>Bookmarks</span>
              </button>
              <div class="bookmarks">
                <ul class="bookmarks__list"></ul>
              </div>
            </li>
          </ul>
          <button class="nav__btn nav__btn--theme" id="theme-toggle">
            <svg class="nav__icon nav__icon--sun">
              <use href="src/img/icons.svg#icon-sun"></use>
            </svg>
            <svg class="nav__icon nav__icon--moon">
              <use href="src/img/icons.svg#icon-moon"></use>
            </svg>
          </button>
          <button class="nav__btn nav__btn--mobile-nav">
            <svg class="nav__icon">
              <use href="src/img/icons.svg#icon-menu"></use>
            </svg>
          </button>
        </nav>
      </header>

      <div class="search-results">
        <ul class="results"></ul>
        <div class="pagination"></div>
      </div>

      <div class="recipe">
        <div class="message">
          <div>
            <svg>
              <use href="src/img/icons.svg#icon-smile"></use>
            </svg>
          </div>
          <p>
            Discover your next favorite recipe by searching for dishes or
            ingredients. Try searching for a specific recipe to get started!
          </p>
        </div>
      </div>
    </div>

    <div class="overlay hidden"></div>
    <div class="add-recipe-window hidden">
      <button class="btn--close-modal">&times;</button>
      <form class="upload">
        <div class="upload__column">
          <h3 class="upload__heading">Recipe data</h3>
          <label>Title</label>
          <input value="TEST123" required name="title" type="text" />
          <label>URL</label>
          <input value="TEST123" required name="sourceUrl" type="text" />
          <label>Image URL</label>
          <input value="TEST123" required name="image" type="text" />
          <label>Publisher</label>
          <input value="TEST123" required name="publisher" type="text" />
          <label>Prep time</label>
          <input value="10" required name="cookingTime" type="number" />
          <label>Servings</label>
          <input value="20" required name="servings" type="number" />
        </div>

        <div class="upload__column">
          <h3 class="upload__heading">Ingredients</h3>
          <div class="ingredient-container">
            <label>Ingredient 1</label>
            <input
              value="2,kg,Rice"
              type="text"
              required
              name="ingredient-1"
              placeholder="'Quantity,Unit,Description'"
            />
            <label>Ingredient 2</label>
            <input
              value="2,,Onion"
              type="text"
              name="ingredient-2"
              placeholder="'Quantity,Unit,Description'"
            />
            <label>Ingredient 3</label>
            <input
              value=",,Potato"
              type="text"
              name="ingredient-3"
              placeholder="'Quantity,Unit,Description'"
            />
            <label>Ingredient 4</label>
            <input
              type="text"
              name="ingredient-4"
              placeholder="'Quantity,Unit,Description'"
            />
            <label>Ingredient 5</label>
            <input
              type="text"
              name="ingredient-5"
              placeholder="'Quantity,Unit,Description'"
            />
            <label>Ingredient 6</label>
            <input
              type="text"
              name="ingredient-6"
              placeholder="'Quantity,Unit,Description'"
            />
          </div>
          <button type="button" class="btn btn--small btn--add-ingredient">
            <svg>
              <use href="src/img/icons.svg#icon-plus-circle"></use>
            </svg>
            <span>Add Ingredient</span>
          </button>
        </div>

        <button class="btn upload__btn">
          <svg>
            <use href="src/img/icons.svg#icon-upload-cloud"></use>
          </svg>
          <span>Upload</span>
        </button>
      </form>
    </div>

    <div class="auth-window hidden">
      <button class="btn--close-modal">&times;</button>
      <div class="auth-container"></div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (!window.location.hash) {
          const recipeContainer = document.querySelector('.recipe');
          if (recipeContainer) {
            const errorMessage = recipeContainer.querySelector('.error');
            if (errorMessage) {
              errorMessage.remove();
              window.recipeView.renderWelcomePage();
            }
          }
        }
      });
    </script>
  </body>
</html>
