        <nav class="nav">

            <li class="nav__item nav__item--auth">

              <div class="nav__bookmarks-preview hidden">

    <div class="auth-window hidden">
      <button class="btn--close-modal">&times;</button>
      <div class="auth-container"></div>
    </div>

    <script>
      // Force remove error message and show welcome page
      document.addEventListener('DOMContentLoaded', function () {
        if (!window.location.hash) {
          const recipeContainer = document.querySelector('.recipe');
          if (recipeContainer) {
            const errorMessage = recipeContainer.querySelector('.error');
            if (errorMessage) {
              errorMessage.remove();
              window.recipeView.renderWelcomePage();
            }
          }
        }
      });
    </script>
